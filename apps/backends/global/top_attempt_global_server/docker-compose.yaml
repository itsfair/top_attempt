name: top_attempt_global_server
services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: top_attempt
      POSTGRES_PASSWORD: "v_fHWB6H8VlGf1xkGzzbhm187L4YOar_"
    volumes:
      - top_attempt_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "JrJna-izJvv4X7tG5tH0DYv68Dx7FBv1"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: top_attempt_test
      POSTGRES_PASSWORD: "bAJRYo9iP_s8MfWmK7QPFSVcHe81As8Q"
    volumes:
      - top_attempt_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "z1dTRGMsjMEZQdG17Ogvgf2QbTGeJiAL"
    environment:
      - REDIS_REPLICATION_MODE=master

  # File storage (RustFS, S3-compatible).
  # S3 API on :9000, web console on :9001 (login: rustfsadmin /
  # rustfsadmin_secret). The serverpod_cloud_storage_rustfs adapter defaults
  # to http://localhost:9001; for production change the credentials and point
  # the server at a real endpoint via the SERVERPOD_RUSTFS_* variables.
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin_secret
      - RUSTFS_CONSOLE_ENABLE=true
    command: /data
    volumes:
      - top_attempt_files:/data

  # One-shot provisioning of the 'serverpod' bucket (public read).
  create_buckets:
    image: minio/mc
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myrustfs http://rustfs_server:9000 rustfsadmin rustfsadmin_secret; do sleep 2; done;
      /usr/bin/mc mb myrustfs/top-attempt --ignore-existing;
      /usr/bin/mc anonymous set public myrustfs/top-attempt;
      exit 0;
      "

volumes:
  top_attempt_data:
  top_attempt_test_data:
  top_attempt_files:
