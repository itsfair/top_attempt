name: top_attempt_shared
description: Shared Flutter components for the top_attempt frontends
  (profile state, account dropdown, profile screen).
publish_to: 'none'

environment:
  sdk: '^3.12.2'
  flutter: '>=3.32.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The shared components operate on the global instance's data
  # (UserProfileModel, ProfileDetails) and call the global backend.
  top_attempt_global_client:
    path: ../../backends/global/top_attempt_global_client
  serverpod_auth_core_client: 4.0.2
  go_router: ^17.2.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
